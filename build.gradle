plugins {
    id 'java'
}

allprojects {
    group = 'io.github.inframeshai'
    version = '0.1.3'

    repositories {
        mavenCentral()
    }
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }

        dependencies {
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testImplementation 'io.projectreactor:reactor-test'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }

        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << '-parameters'
        }
    }

    // Spring Boot's BOM is a build-time concern only: it picks the versions this SDK is
    // compiled and tested against, but lives in a configuration that is never published,
    // so consumers do not inherit the BOM (see versionMapping in inframesh-node/build.gradle).
    plugins.withId('java') {
        configurations {
            internalPlatform {
                canBeConsumed = false
                canBeResolved = false
            }
            [compileClasspath, runtimeClasspath, annotationProcessor,
             testCompileClasspath, testRuntimeClasspath, testAnnotationProcessor].each {
                it.extendsFrom(internalPlatform)
            }
        }

        dependencies {
            internalPlatform platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        }
    }
}
