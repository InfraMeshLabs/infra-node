plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
    id 'com.vanniktech.maven.publish'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    implementation 'org.springframework:spring-web'

    api 'tools.jackson.core:jackson-databind'

    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'io.projectreactor:reactor-core'

    implementation 'com.github.oshi:oshi-core:7.6.0'
    implementation 'org.slf4j:slf4j-api'
}

// Lets spring-boot-configuration-processor merge
// META-INF/additional-spring-configuration-metadata.json into the generated metadata.
tasks.named('compileJava') {
    inputs.files(tasks.named('processResources'))
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates(project.group as String, 'inframesh-node', project.version as String)

    pom {
        name = 'InfraMesh Node'
        description = 'Common contracts and Spring Boot auto-configured node infrastructure - health monitoring (CPU/GPU/memory), API key authentication, and the outbound Console connection SDK - used across the InfraMesh platform (Console, Router, Worker).'
        url = 'https://github.com/InfraMeshLabs/infra-node'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = 'koboolean'
                name = 'koboolean'
                email = 'koboolean@gmail.com'
            }
        }

        scm {
            url = 'https://github.com/InfraMeshLabs/infra-node'
            connection = 'scm:git:git://github.com/InfraMeshLabs/infra-node.git'
            developerConnection = 'scm:git:ssh://git@github.com/InfraMeshLabs/infra-node.git'
        }
    }
}
